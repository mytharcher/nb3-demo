name: NocoBase Studio nb3-demo preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: nb-studio-nb3-demo-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy same-repository PR preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-preview')
    runs-on: ubuntu-latest
    env:
      NB_STUDIO_URL: https://web-a-nbstudio.roguehosts.com/main
      NB_STUDIO_KEYCHAIN: 'off'
      APP_ID: nb3-demo-pr-${{ github.event.pull_request.number }}
      ENVIRONMENT: preview
      LOGS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check preview credential availability
        id: credential
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NB_STUDIO_API_KEY" ]]; then
            echo '::notice::Preview skipped: NB_STUDIO_API_KEY is unavailable (including Dependabot PRs without secrets).'
            echo 'Preview skipped: NB_STUDIO_API_KEY is unavailable. A repository administrator must configure the CI secret.' >> "$GITHUB_STEP_SUMMARY"
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credential.outputs.available == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: steps.credential.outputs.available == 'true'

      - uses: actions/setup-node@v4
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install Studio CLI
        if: steps.credential.outputs.available == 'true'
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY }}
        shell: bash
        run: |
          metadata="$(printf 'x-api-key: %s\n' "$NB_STUDIO_API_KEY" | curl --fail --silent --show-error \
            --header @- "$NB_STUDIO_URL/api/agents/dist/products/nb-studio/targets/linux-x64?format=env")"
          download_path="$(sed -n 's/^url=//p' <<< "$metadata")"
          checksum="$(sed -n 's/^sha256=//p' <<< "$metadata")"
          # Read fields as data; never execute the distribution response as shell code.
          [[ "$download_path" == /api/agents/dist/products/nb-studio/versions/*/files/* && "$checksum" =~ ^[0-9a-f]{64}$ ]]
          printf 'x-api-key: %s\n' "$NB_STUDIO_API_KEY" | curl --fail --silent --show-error \
            --header @- "$NB_STUDIO_URL$download_path" --output "$RUNNER_TEMP/nb-studio.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/nb-studio.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nb-studio"
          tar -xzf "$RUNNER_TEMP/nb-studio.tar.gz" -C "$RUNNER_TEMP/nb-studio" --strip-components=1
          echo "$RUNNER_TEMP/nb-studio/bin" >> "$GITHUB_PATH"

      - name: Sign in to Studio
        if: steps.credential.outputs.available == 'true'
        id: studio
        env:
          NB_STUDIO_API_KEY: ${{ secrets.NB_STUDIO_API_KEY }}
        shell: bash
        run: printf '%s' "$NB_STUDIO_API_KEY" | nb-studio login --server "$NB_STUDIO_URL" --api-key-stdin

      - name: Report build started
        if: steps.credential.outputs.available == 'true'
        run: nb-studio build status --app "$APP_ID" --state building --logs "$LOGS"

      - name: Install dependencies
        if: steps.credential.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build deployment archive
        if: steps.credential.outputs.available == 'true'
        run: pnpm build --target linux-x64 --tar

      # Studio infers the repository and PR head SHA from GitHub Actions.
      # The first PR deployment binds the app to its source; Studio deletes it on close/merge.
      - name: Deploy isolated preview
        if: steps.credential.outputs.available == 'true'
        run: |
          nb-studio app ensure "$APP_ID" --environment "$ENVIRONMENT"
          nb-studio deploy --app "$APP_ID" --file storage/exports/dist.tar.gz

      - name: Report build failed
        if: failure() && steps.studio.outcome == 'success'
        run: nb-studio build status --app "$APP_ID" --state failed --logs "$LOGS"
